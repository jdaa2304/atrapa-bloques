name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pygame-ce pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name AtrapaBloques --collect-all pygame main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtrapaBloques-Windows
          path: dist/AtrapaBloques.exe

